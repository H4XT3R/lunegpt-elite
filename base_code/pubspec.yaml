name: lunegpt
description: "LuneGPT Elite Intelligence - Optimized by Adam Aghnia"

# The following line prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Required for llama_flutter_android

dependencies:
  flutter:
    sdk: flutter

  # --- CORE AI ENGINE ---
  llama_flutter_android: ^0.1.1 # The GGUF inference engine
  
  # --- FILE MANAGEMENT ---
  path_provider: ^2.1.2 # Finds the private folder for your 2GB model
  
  # --- UI & ICONS ---
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Enables Material 3 design for that clean "Architect" look
  uses-material-design: true

  # If you decide to add custom fonts or local assets later, 
  # they would go under this section.
