name: LuneGPT Elite Engine
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh Project Injection
        run: |
          # 1. Create a clean factory project
          flutter create --platforms android --project-name lunegpt factory
          
          # 2. Inject your logic and dependencies
          cp base_code/main.dart factory/lib/main.dart
          cp base_code/pubspec.yaml factory/pubspec.yaml
          
          # 3. Enter factory to apply the "Elite" fixes
          cd factory
          
          # --- 🛡️ THE INTERNET FIX (DO NOT REMOVE) ---
          # This inserts internet permissions so the AI brain can download
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # This allows the app to talk to download servers without being blocked
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # ------------------------------------------

          # 4. Apply High-Performance AI Fixes
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle.kts
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties

      - name: Build Elite APK
        run: |
          cd factory
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuneGPT-Elite-Release
          path: factory/build/app/outputs/flutter-apk/app-release.apk
