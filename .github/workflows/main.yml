name: LuneGPT Elite Engine
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh Project Injection
        run: |
          flutter create --platforms android --project-name lunegpt factory
          cp base_code/main.dart factory/lib/main.dart
          cp base_code/pubspec.yaml factory/pubspec.yaml
          cd factory
          
          # 🛡️ SYSTEM PERMISSIONS & RAM UNLOCK
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:largeHeap="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # ⚙️ CRASH PREVENTION (Disable Minification)
          # This ensures the AI code isn't "shrunk" or broken during the build
          echo "android.enableR8=false" >> android/gradle.properties
          sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle.kts || true
          sed -i 's/shrinkResources true/shrinkResources false/' android/app/build.gradle.kts || true

          # 🔧 NDK & SDK CONFIG
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle.kts
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties

      - name: Build Elite APK
        run: |
          cd factory
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuneGPT-Elite-Release
          path: factory/build/app/outputs/flutter-apk/app-release.apk
