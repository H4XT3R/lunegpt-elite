name: LuneGPT Elite Engine
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh Project Injection
        run: |
          # 1. Create clean factory project
          flutter create --platforms android --project-name lunegpt factory
          cp base_code/main.dart factory/lib/main.dart
          cp base_code/pubspec.yaml factory/pubspec.yaml
          cd factory
          
          # 🛡️ PERMISSIONS & RAM UNLOCK
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:largeHeap="true" android:usesClaretextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # 🧠 AI SAFE-GUARD (Keep R8 from breaking the Llama engine)
          # Instead of disabling R8, we tell it to NOT shrink or optimize the AI native code
          echo "-keep class com.github.anuscorne.llama_flutter_android.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class com.sun.jna.** { *; }" >> android/app/proguard-rules.pro
          
          # 🔧 NDK & SDK CONFIG
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle.kts
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties

      - name: Build Elite APK
        run: |
          cd factory
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuneGPT-Elite-Release
          path: factory/build/app/outputs/flutter-apk/app-release.apk
