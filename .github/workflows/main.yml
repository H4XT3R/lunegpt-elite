name: LuneGPT Elite Engine
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh Project Injection
        run: |
          flutter create --platforms android --project-name lunegpt factory
          cp base_code/main.dart factory/lib/main.dart
          cp base_code/pubspec.yaml factory/pubspec.yaml
          cd factory
          
          # 🛡️ PERMISSION INJECTION
          find android/app/src -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' {} +
          find android/app/src -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' {} +
          find android/app/src -name "AndroidManifest.xml" -exec sed -i 's/<application/<application android:largeHeap="true" android:usesCleartextTraffic="true"/' {} +
          
          # 🧠 AI STABILITY (KEEPING THE ENGINE ALIVE)
          echo "-keep class com.github.anuscorne.llama_flutter_android.** { *; }" >> android/app/proguard-rules.pro
          
          # 🔧 NDK FIX
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle.kts
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties

      - name: Build Elite APK
        run: |
          cd factory
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuneGPT-Elite-Release
          path: factory/build/app/outputs/flutter-apk/app-release.apk
